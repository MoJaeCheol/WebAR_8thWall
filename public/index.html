<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>어디로든 문 AR — 8th Wall + Immersal</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- 8th Wall (2026-02 오픈소스 전환 이후 App Key 불필요) -->
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" async data-preload-chunks="slam"></script>

  <!-- 프로젝트 코드 (a-scene 파싱 전에 컴포넌트 등록이 끝나야 한다) -->
  <script src="js/config.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/png.js"></script>
  <script src="js/ply.js"></script>
  <script src="js/immersal.js"></script>
  <script src="js/components/anywhere-door.js"></script>
  <script src="js/components/collectible.js"></script>
  <script src="js/components/experience.js"></script>
  <script src="js/app.js"></script>
</head>

<body>

<!-- ── 시작 화면 ─────────────────────────────────────── -->
<div id="loader">
  <div class="bell"></div>
  <h1>어디로든 문 AR</h1>
  <p>
    카메라를 켜고 주변을 천천히 비춰줘.<br>
    위치가 인식되면 문이 나타나!
  </p>
  <button id="startBtn">AR 시작하기</button>
</div>

<!-- ── 개발자 모드 진입 버튼 (우상단) ───────────────────── -->
<button id="devBtn" title="개발자 모드">⚙</button>

<!-- ── 개발자 패널 ───────────────────────────────────── -->
<aside id="devPanel">
  <header>
    <span class="title">개발자 모드</span>
    <span class="build" id="devBuild">build …</span>
    <button id="devCollapse" title="접기">▲</button>
  </header>

  <div class="body">
    <section>
      <h4>1. 맵 검증</h4>
      <div class="kv"><span>맵 ID</span><b id="devMapId">–</b></div>
      <div class="kv"><span>측위 성공</span><b id="devLocStat">0 / 0</b></div>
      <div class="kv"><span>특징점 수</span><b id="devPoints">–</b></div>
      <div class="kv"><span>스케일</span><b id="devScale">–</b></div>
      <div class="kv"><span>두 지점 일치</span><b id="devAgree">–</b></div>
      <p class="verdict" id="devVerdict">측위를 기다리는 중…</p>
      <button class="wide" id="devTogglePoints">맵 특징점 겹쳐 보기</button>
    </section>

    <section>
      <h4>2. 문 위치 지정</h4>
      <p class="note">바닥을 탭해 문을 놓고, 각도를 맞춘 뒤 <b>저장</b>. 저장한 위치는 모든 접속자에게 동일하게 적용됩니다.</p>
      <div class="kv"><span>저장된 위치</span><b id="devAnchor">없음</b></div>
      <div class="kv"><span>현재 배치</span><b id="devCurrent">없음</b></div>
      <div class="btns">
        <button id="devRotL">↺ 15°</button>
        <button id="devRotR">15° ↻</button>
        <button id="devSave" class="primary">저장</button>
        <button id="devDelete" class="danger">저장 삭제</button>
      </div>
    </section>

    <section>
      <h4>3. 진단</h4>
      <div class="kv"><span>카메라</span><b id="devCam">–</b></div>
      <div class="kv"><span>규약</span><b id="devConv">–</b></div>
      <div class="btns">
        <button id="devCycleConv">규약 수동 변경</button>
        <button id="devToggleLog">로그 보기</button>
      </div>
    </section>
  </div>
</aside>

<div id="log"></div>

<!-- ── 관람 HUD ─────────────────────────────────────── -->
<div id="hud">
  <div class="hud-top">
    <div class="chip"><span id="dotTracking" class="dot pending"></span><span id="textTracking">트래킹 준비 중</span></div>
    <div class="chip"><span id="dotVps" class="dot"></span><span id="textVps">VPS 확인 중</span></div>
  </div>
  <div class="hud-bottom">
    <div id="hint">카메라를 준비하는 중…</div>
    <div class="btn-row">
      <div class="chip" style="pointer-events:none"><span>🔔</span><span id="count">0 / 0</span></div>
    </div>
  </div>
</div>

<!-- ── AR 씬 ────────────────────────────────────────── -->
<a-scene
  dora-experience
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  xrweb="allowedDevices: any; scale: absolute">

  <a-camera
    id="camera"
    position="0 1.6 0"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse">
  </a-camera>

  <a-entity
    light="type: directional; intensity: 0.9; castShadow: true;
           shadowMapWidth: 2048; shadowMapHeight: 2048;
           shadowCameraTop: 12; shadowCameraBottom: -12;
           shadowCameraRight: 12; shadowCameraLeft: -12;
           target: #camera"
    xrextras-attach="target: camera; offset: 3 6 2"
    position="1 4 2"
    shadow>
  </a-entity>
  <a-light type="ambient" intensity="0.65"></a-light>

  <!-- 그림자만 받는 바닥. 개발자 모드에서 탭 레이캐스트 대상이기도 하다. -->
  <a-box
    id="ground"
    class="cantap"
    scale="200 2 200"
    position="0 -1 0"
    material="shader: shadow; transparent: true; opacity: 0.32"
    shadow>
  </a-box>

  <!-- 맵 좌표계 콘텐츠 루트. 측위가 성공하면 이 루트가 실제 공간에 정렬된다. -->
  <a-entity id="contentRoot"></a-entity>

</a-scene>

</body>
</html>
